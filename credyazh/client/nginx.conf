# ─── CredYazh Client — Nginx config ──────────────────────────────────────────
# Proxies /api/* to the Express server container.
# All other paths served as the React SPA (supports client-side routing).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy /api/* → Express server (service name from compose: "server")
    location /api/ {
        proxy_pass         http://server:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";

        # Large audio uploads need a bigger body limit
        client_max_body_size 10m;
    }

    # React SPA fallback — any unknown path returns index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Content-Type-Options  nosniff;
    add_header X-Frame-Options         SAMEORIGIN;
}

